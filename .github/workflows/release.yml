name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия из тега
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Заполнить module.json
        run: |
          jq --arg v "$VERSION" \
             --arg m "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/module.json" \
             --arg d "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip" \
             --arg u "https://github.com/${GITHUB_REPOSITORY}" \
             '.version=$v | .manifest=$m | .download=$d | .url=$u' module.json > module.tmp
          mv module.tmp module.json
      - name: Собрать module.zip
        run: zip -r module.zip . -x ".git/*" ".github/*" "*/node_modules/*" "features/voice-portraits/bot/config.json" "module.zip"
      - name: Прикрепить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber
